services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-100.94.96.41}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-rotinaplusdev}
      DB_USERNAME: ${DB_USERNAME:?Defina DB_USERNAME no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
    depends_on:
      - backend
    restart: unless-stopped

  # Banco local opcional, para quem estiver sem Tailscale/offline.
  # Suba com: docker compose --profile local up
  # e defina DB_HOST=db, DB_USERNAME/DB_PASSWORD à sua escolha e RUN_MIGRATIONS=true no .env.
  db:
    profiles: ["local"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rotinaplusdev}
      POSTGRES_USER: ${DB_USERNAME:-rotina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rotina}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql

volumes:
  backend_vendor:
  frontend_node_modules:
  pgdata_local:
